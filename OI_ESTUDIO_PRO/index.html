<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080808"><title>OI ESTUDIO PRO</title>
<style>
:root{--gold:#d4af37;--bg:#0a0a0a;--panel:#171717;--line:#333;--txt:#f4f1e8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:15px system-ui,Arial}.layout{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.side{background:#101010;border-right:1px solid var(--line);padding:20px;position:sticky;top:0;height:100vh}.brand{font-size:21px;font-weight:900;color:var(--gold);margin-bottom:24px}.brand small{display:block;color:#ddd;font-size:10px;letter-spacing:3px}.nav{display:grid;gap:5px}.nav button{background:none;color:#ddd;border:0;text-align:left;padding:12px;border-radius:8px}.nav button.active,.nav button:hover{background:#292310;color:var(--gold)}main{min-width:0}.top{padding:18px 26px;border-bottom:1px solid var(--line);color:var(--gold);font-weight:bold;position:sticky;top:0;background:#0d0d0d}.wrap{padding:26px;max-width:1400px;margin:auto}.tag{font-size:11px;color:var(--gold);letter-spacing:2px;text-transform:uppercase}.title{font-size:28px;margin:8px 0}.muted{color:#aaa;margin:0 0 22px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.card,.folder{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}.label{color:#aaa;font-size:13px}.num{color:var(--gold);font-size:27px;font-weight:800;margin:8px 0}.folders{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.folder h3{font-size:15px;margin:9px 0}.folder p{color:#aaa;font-size:12px}.btn{background:var(--gold);color:#111;border:1px solid var(--gold);padding:10px 13px;border-radius:8px;font-weight:bold;cursor:pointer}.btn.alt{background:#222;color:#eee;border-color:#444}.btn.del{background:#3a1717;color:#ffbaba;border-color:#6a3333}.row{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.search,input,select,textarea{background:#0e0e0e;color:#fff;border:1px solid #444;border-radius:7px;padding:10px;max-width:100%}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:10px}table{border-collapse:collapse;width:100%;min-width:580px;background:#151515}th,td{padding:12px;border-bottom:1px solid #333;text-align:left;font-size:13px}th{color:var(--gold);background:#211e13}.empty{text-align:center;color:#999;padding:24px}.notice{padding:13px;border:1px solid #66531c;background:#211d10;border-radius:9px;color:#e9dcae;font-size:12px;line-height:1.5;margin:15px 0}.modal{display:none;position:fixed;inset:0;background:#000b;z-index:5;align-items:center;justify-content:center;padding:15px}.modal.show{display:flex}.box{background:#171717;border:1px solid var(--gold);border-radius:13px;padding:20px;width:min(620px,100%);max-height:90vh;overflow:auto}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;color:#bbb;font-size:12px;margin-bottom:5px}.field input,.field select,.field textarea{width:100%}.field textarea{min-height:70px}.foot{color:#777;font-size:11px;margin-top:18px}@media(max-width:800px){.layout{grid-template-columns:1fr}.side{position:relative;height:auto;padding:12px;border:0;border-bottom:1px solid var(--line)}.brand{margin:3px 5px 12px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;padding:9px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.folders{grid-template-columns:repeat(2,minmax(0,1fr))}.wrap{padding:17px 12px}.top{padding:14px}.title{font-size:24px}}@media(max-width:450px){.folders,.fields{grid-template-columns:1fr}.card{padding:12px}.num{font-size:22px}}
</style></head><body><div class="layout"><aside class="side"><div class="brand">OI ESTUDIO<small>PRO • GESTÃO DIGITAL</small></div><nav class="nav" id="nav"><button class="active" data-page="home">▦ Painel</button><button data-page="files">▤ Arquivo</button><button data-page="clients">♙ Clientes</button><button data-page="projects">▣ Projectos</button><button data-page="finance">◈ Financeiro</button><button data-page="team">♧ Equipa</button><button data-page="equipment">◉ Equipamentos</button><button data-page="tasks">✓ Tarefas</button></nav></aside><main><header class="top">OI ESTUDIO PRO <span style="color:#777;font-weight:normal">/ Protótipo</span></header><div id="content" class="wrap"></div></main></div>
<div class="modal" id="modal"><div class="box"><div style="display:flex;justify-content:space-between;align-items:center"><h2 id="modalTitle">Novo registo</h2><button class="btn alt" id="close">Fechar</button></div><form id="form"><div id="fields" class="fields"></div><div class="row" style="justify-content:flex-end"><button type="submit" class="btn">Guardar</button></div></form></div></div>
<script>
const defs={
clients:{title:'Clientes',desc:'Registe e consulte os clientes do estúdio.',button:'＋ Novo cliente',fields:[['name','Nome / empresa','text',1],['phone','Telefone','tel'],['email','E-mail','email'],['kind','Tipo de cliente','select',['Particular','Empresa','Instituição','Outro']],['notes','Observações','textarea']],cols:[['name','Nome'],['phone','Telefone'],['email','E-mail'],['kind','Tipo']]},
projects:{title:'Projectos',desc:'Acompanhe os trabalhos fotográficos e audiovisuais.',button:'＋ Novo projecto',fields:[['name','Nome do projecto','text',1],['client','Cliente','text'],['service','Serviço','select',['Fotografia','Vídeo publicitário','Redes sociais','Entrevista','Evento','Vídeo de produto','Outro']],['owner','Responsável','text'],['due','Prazo','date'],['value','Valor acordado (Kz)','number'],['status','Estado','select',['Novo','Orçamento enviado','Aprovado','Em produção','Em edição','Concluído','Entregue','Cancelado']],['notes','Descrição','textarea']],cols:[['name','Projecto'],['client','Cliente'],['service','Serviço'],['due','Prazo'],['status','Estado'],['value','Valor Kz']]},
finance:{title:'Financeiro',desc:'Registe entradas e despesas em kwanzas.',button:'＋ Novo movimento',fields:[['date','Data','date',1],['type','Tipo','select',['Entrada','Saída']],['category','Categoria','text'],['description','Descrição','text',1],['person','Cliente / fornecedor','text'],['amount','Valor (Kz)','number',1]],cols:[['date','Data'],['type','Tipo'],['category','Categoria'],['description','Descrição'],['person','Cliente / fornecedor'],['amount','Valor Kz']]},
team:{title:'Equipa',desc:'Organize funções e responsabilidades dos colaboradores.',button:'＋ Adicionar membro',fields:[['name','Nome completo','text',1],['role','Função','select',['Director-geral','Administrador','Financeiro','Fotógrafo','Videógrafo','Editor','Marketing','Outro']],['phone','Telefone','tel'],['email','E-mail','email'],['status','Estado','select',['Activo','Freelancer','Inactivo']],['notes','Responsabilidades','textarea']],cols:[['name','Nome'],['role','Função'],['phone','Telefone'],['email','E-mail'],['status','Estado']]},
equipment:{title:'Equipamentos',desc:'Controle inventário, estado e manutenção.',button:'＋ Novo equipamento',fields:[['name','Equipamento','text',1],['model','Marca / modelo','text'],['qty','Quantidade','number'],['state','Estado','select',['Novo','Em bom estado','Em manutenção','Avariado']],['owner','Responsável','text'],['maintenance','Próxima manutenção','date'],['notes','Observações','textarea']],cols:[['name','Equipamento'],['model','Modelo'],['qty','Qtd.'],['state','Estado'],['owner','Responsável'],['maintenance','Manutenção']]},
tasks:{title:'Tarefas',desc:'Acompanhe actividades, responsáveis e prazos.',button:'＋ Nova tarefa',fields:[['name','Tarefa','text',1],['area','Área','select',['Administração','Fotografia','Vídeo','Financeiro','Marketing','Equipamentos','Outra']],['owner','Responsável','text'],['due','Prazo','date'],['priority','Prioridade','select',['Baixa','Média','Alta','Urgente']],['status','Estado','select',['Pendente','Em curso','Concluída','Adiada']],['notes','Notas','textarea']],cols:[['name','Tarefa'],['area','Área'],['owner','Responsável'],['due','Prazo'],['priority','Prioridade'],['status','Estado']]}
};
const key='oiprov1';let db;try{db=JSON.parse(localStorage.getItem(key))}catch(e){};if(!db)db={clients:[],projects:[],finance:[],team:[],equipment:[],tasks:[],files:[]};let page='home',mod='',term='';
const $=s=>document.querySelector(s),content=$('#content'),modal=$('#modal');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cash=n=>(Number(n)||0).toLocaleString('pt-PT',{maximumFractionDigits:2})+' Kz';
function save(){localStorage.setItem(key,JSON.stringify(db))}
function head(k,t,d,b=''){return `<div style="color:var(--gold);font-size:11px;letter-spacing:2px">${k}</div><h1 class="title">${t}</h1><p class="muted">${d}</p>${b?`<div class="row"><button id="add" class="btn">${b}</button><input id="search" class="search" placeholder="Pesquisar..." value="${esc(term)}"></div>`:''}`}
function dashboard(){let inc=db.finance.filter(x=>x.type==='Entrada').reduce((a,x)=>a+(+x.amount||0),0),out=db.finance.filter(x=>x.type==='Saída').reduce((a,x)=>a+(+x.amount||0),0),active=db.projects.filter(x=>!['Entregue','Concluído','Cancelado'].includes(x.status)).length;content.innerHTML=head('VISÃO GERAL','Bem-vindo à OI ESTUDIO PRO','Acompanhe a actividade do estúdio num só lugar.')+`<div class="grid"><div class="card"><div class="label">Clientes</div><div class="num">${db.clients.length}</div></div><div class="card"><div class="label">Projectos activos</div><div class="num">${active}</div></div><div class="card"><div class="label">Entradas</div><div class="num">${cash(inc)}</div></div><div class="card"><div class="label">Saídas</div><div class="num">${cash(out)}</div></div></div><h2 style="margin-top:26px">Acesso rápido</h2><div class="folders">${[['📂','Arquivo digital','Organize links de pastas e ficheiros','files'],['👥','Clientes','Cadastro e histórico','clients'],['🎬','Projectos','Prazos e entregas','projects'],['💰','Financeiro','Entradas e despesas','finance'],['🧑‍💼','Equipa','Funções e responsabilidades','team'],['✓','Tarefas','Actividades e prazos','tasks']].map(a=>`<div class="folder"><div style="font-size:25px">${a[0]}</div><h3>${a[1]}</h3><p>${a[2]}</p><button class="btn alt" onclick="go('${a[3]}')">Abrir</button></div>`).join('')}</div><div class="notice"><b>Importante:</b> esta é uma versão demonstrativa. Os dados ficam apenas neste navegador; ainda não existe login seguro, partilha entre colaboradores ou armazenamento na nuvem. Não use para guardar informações sensíveis.</div>`}
function module(k){let d=defs[k];content.innerHTML=head('GESTÃO',d.title,d.desc,d.button)+`<div class="tablewrap"><table><thead><tr>${d.cols.map(c=>`<th>${c[1]}</th>`).join('')}<th>Acção</th></tr></thead><tbody>${db[k].filter(x=>JSON.stringify(x).toLowerCase().includes(term.toLowerCase())).map((x,i)=>`<tr>${d.cols.map(c=>`<td>${esc(c[0]==='amount'||c[0]==='value'?cash(x[c[0]]):x[c[0]])}</td>`).join('')}<td><button class="btn del" onclick="del('${k}',${i})">Eliminar</button></td></tr>`).join('')||`<tr><td class="empty" colspan="${d.cols.length+1}">Sem registos. Use o botão acima para começar.</td></tr>`}</tbody></table></div><p class="foot">Os dados ficam guardados neste navegador neste protótipo.</p>`;$('#add').onclick=()=>form(k);$('#search').oninput=e=>{term=e.target.value;module(k);$('#search').focus()}}
const folders=[['📁','01. Administração','Actas, decisões e documentos oficiais.'],['👥','02. Clientes','Pastas individuais por cliente.'],['📷','03. Fotografia','Originais, selecção, edição e entrega.'],['🎥','04. Produção de vídeo','Brutos, edição e exportações.'],['💰','05. Financeiro','Receitas, despesas e comprovativos.'],['🧑‍💼','06. Recursos humanos','Equipa e documentos autorizados.'],['📣','07. Marketing','Campanhas e portfólio.'],['📸','08. Equipamentos','Inventário e garantias.'],['🗄️','09. Arquivo concluído','Projectos entregues.']];
function files(){content.innerHTML=head('DOCUMENTOS','Arquivo digital','Organize os links das pastas e ficheiros da empresa.')+`<div class="notice">Este módulo é um índice, não um armazenamento real. Crie as pastas num serviço de nuvem e registe os links aqui. Upload directo e sincronização ainda não estão ligados.</div><div class="row"><button class="btn" id="add">＋ Adicionar link</button><input id="search" class="search" placeholder="Pesquisar pastas..." value="${esc(term)}"></div><div class="folders">${folders.filter(f=>f.join(' ').toLowerCase().includes(term.toLowerCase())).map(f=>`<div class="folder"><div style="font-size:25px">${f[0]}</div><h3>${f[1]}</h3><p>${f[2]}</p></div>`).join('')}</div><h2 style="margin-top:24px">Links registados</h2><div class="tablewrap"><table><thead><tr><th>Nome</th><th>Categoria</th><th>Link</th><th>Acção</th></tr></thead><tbody>${db.files.map((f,i)=>`<tr><td>${esc(f.name)}</td><td>${esc(f.category)}</td><td><a style="color:var(--gold)" href="${esc(f.url)}" target="_blank" rel="noopener">Abrir</a></td><td><button class="btn del" onclick="del('files',${i})">Eliminar</button></td></tr>`).join('')||'<tr><td colspan="4" class="empty">Ainda não existem links.</td></tr>'}</tbody></table></div>`;$('#add').onclick=()=>fileForm();$('#search').oninput=e=>{term=e.target.value;files();$('#search').focus()}}
function showForm(title,fields){$('#modalTitle').textContent=title;$('#fields').innerHTML=fields.map(f=>{let [n,l,t,x]=f;if(t==='select')return `<div class="field"><label>${l}</label><select name="${n}">${x.map(v=>`<option>${v}</option>`).join('')}</select></div>`;if(t==='textarea')return `<div class="field" style="grid-column:1/-1"><label>${l}</label><textarea name="${n}"></textarea></div>`;return `<div class="field"><label>${l}${x===1?' *':''}</label><input name="${n}" type="${t}" ${x===1?'required':''} ${t==='number'?'min="0" step="0.01"':''}></div>`}).join('');modal.classList.add('show')}
function form(k){mod=k;showForm(defs[k].button,defs[k].fields)}
function fileForm(){mod='files';showForm('Adicionar link digital',[['name','Nome da pasta/ficheiro','text',1],['category','Categoria','select',['Administração','Cliente','Fotografia','Vídeo','Financeiro','Marketing','Outro']],['url','Link do Drive ou serviço de nuvem','url',1]])}
$('#form').onsubmit=e=>{e.preventDefault();let obj=Object.fromEntries(new FormData(e.target).entries());db[mod].push(obj);save();modal.classList.remove('show');term='';render()};
function del(k,i){if(confirm('Eliminar este registo?')){db[k].splice(i,1);save();render()}}
function go(p){page=p;term='';document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render();window.scrollTo(0,0)}
function render(){page==='home'?dashboard():page==='files'?files():module(page)}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>go(b.dataset.page));$('#close').onclick=()=>modal.classList.remove('show');modal.onclick=e=>{if(e.target===modal)modal.classList.remove('show')};render();
</script></body></html>
